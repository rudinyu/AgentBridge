name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (native and swiftbuild)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/package-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      # The same script as local CI: builds the CLI and the app and runs every
      # test under both SwiftPM build systems. It needs no provider sign-in,
      # makes no model call and uses no API key.
      - name: Run .codex/ci.sh
        run: ./.codex/ci.sh
